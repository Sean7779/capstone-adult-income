dataset:
  path: data/adult.csv
  target: income

split:
  test_size: 0.2
  random_state: 42

preprocessing:
  scale_numeric: true
  encode_categorical: true

training:
  experiment_name: adult_income_capstone
  models:
    - name: logistic_regression
      params:
        max_iter: 1000

    - name: logistic_regression
      params:
        max_iter: 2000
        C: 0.5

    - name: random_forest
      params:
        n_estimators: 100
        max_depth: 10
        random_state: 42

    - name: random_forest
      params:
        n_estimators: 200
        max_depth: 15
        random_state: 42

    - name: gradient_boosting
      params:
        n_estimators: 100
        learning_rate: 0.1
        max_depth: 3
        random_state: 42

    - name: gradient_boosting
      params:
        n_estimators: 200
        learning_rate: 0.05
        max_depth: 3
        random_state: 42


      









